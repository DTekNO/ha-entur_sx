<!DOCTYPE html>
<html>
<head>
    <title>Transport Icons Test</title>
    <style>
        body { font-family: Arial; padding: 20px; background: #f0f0f0; }
        .icon-test { 
            display: inline-block; 
            margin: 20px; 
            text-align: center;
        }
        .icon-box {
            width: 100px;
            height: 100px;
            background: #0C6693;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
        }
        .icon-box img {
            max-width: 80%;
            max-height: 80%;
        }
        h3 { margin: 10px 0 5px 0; }
    </style>
</head>
<body>
    <h1>Transport Icons Test</h1>
    
    <div class="icon-test">
        <h3>Ferry (from JSON)</h3>
        <div class="icon-box">
            <img id="ferry-icon" alt="Ferry">
        </div>
    </div>
    
    <div class="icon-test">
        <h3>Car Ferry (from JSON)</h3>
        <div class="icon-box">
            <img id="carferry-icon" alt="Car Ferry">
        </div>
    </div>
    
    <script>
        // Load icons from JSON
        fetch('transport_icons.json')
            .then(response => response.json())
            .then(data => {
                document.getElementById('ferry-icon').src = data.ferry;
                document.getElementById('carferry-icon').src = data.carferry;
                
                // Decode and log path counts
                const ferryB64 = data.ferry.split(',')[1];
                const ferrySVG = atob(ferryB64);
                const ferryPaths = (ferrySVG.match(/<path/g) || []).length;
                console.log('Ferry paths:', ferryPaths);
                
                const carferryB64 = data.carferry.split(',')[1];
                const carferrySVG = atob(carferryB64);
                const carferryPaths = (carferrySVG.match(/<path/g) || []).length;
                console.log('Car Ferry paths:', carferryPaths);
            });
    </script>
</body>
</html>
